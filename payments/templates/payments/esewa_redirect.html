<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirecting to eSewa — Park Smart Nepal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .payment-box {
            width: min(92%, 450px);
            background: white;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .payment-box h2 {
            margin-bottom: 10px;
        }

        .payment-box p {
            color: #666;
            line-height: 1.6;
        }

        .loader {
            width: 42px;
            height: 42px;
            margin: 25px auto;
            border: 4px solid #ddd;
            border-top-color: #087f3f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        button {
            border: none;
            background: #087f3f;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h2>Redirecting to eSewa</h2>

    <p>
        Please wait while we securely redirect you to eSewa
        to complete your parking payment.
    </p>

    <div class="loader"></div>

    <form
        id="esewa-payment-form"
        action="{{ esewa_url }}"
        method="POST"
    >

        {% for key, value in payload.items %}
            <input
                type="hidden"
                name="{{ key }}"
                value="{{ value }}"
            >
        {% endfor %}

        <button type="submit">
            Continue to eSewa
        </button>

    </form>

</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById(
            "esewa-payment-form"
        );

        // Automatically redirect to eSewa.
        setTimeout(function () {
            form.submit();
        }, 800);
    });
</script>

</body>
</html>
